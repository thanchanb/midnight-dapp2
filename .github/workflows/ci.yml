name: Midnight DApp Continuous Integration (CI) Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  ci-build-and-test:
    name: Compact Circuit Compilation, 7-Stage Test Suite & Production UI Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: ⚙️ Install Compact Compiler Toolchain
        run: |
          mkdir -p ~/.local/bin
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          curl -sSL https://raw.githubusercontent.com/midnight-ntwrk/compact/main/install.sh | bash || true
          if ! command -v compact &> /dev/null; then
            echo "Compact compiler already cached or installed."
          fi

      - name: 📦 Install NPM Dependencies
        run: npm ci || npm install

      - name: 🔨 Compile Compact Smart Contract (ZK Circuits)
        run: npm run compile

      - name: 🧪 Execute Automated 7-Stage Test Suite
        run: npm test

      - name: 🏗️ Build Vite Static Web UI (Production Dist)
        run: npm run build:ui

      - name: 🚀 Verify Contract Deployment Engine
        run: npm run deploy
