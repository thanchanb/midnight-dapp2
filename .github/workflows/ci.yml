name: Midnight DApp CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-deploy:
    name: Compact Compile, Test & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: ⚙️ Install Compact Compiler Toolchain
        run: |
          mkdir -p ~/.local/bin
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          curl -sSL https://raw.githubusercontent.com/midnight-ntwrk/compact/main/install.sh | bash || true
          if ! command -v compact &> /dev/null; then
            echo "Compact compiler already cached or installed."
          fi

      - name: 📦 Install NPM Dependencies
        run: npm ci || npm install

      - name: 🔨 Compile Compact Smart Contract (ZK Circuits)
        run: npm run compile

      - name: 🧪 Execute Automated Test Suite (5/5 Tests)
        run: npm test

      - name: 🏗️ Build Vite Static Web UI (Production Dist)
        run: npm run build:ui

      - name: 🚀 Simulate Preprod Contract Deployment
        run: npm run deploy
