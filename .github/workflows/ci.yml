name: Midnight DApp Continuous Integration (CI) Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  ci-build-and-test:
    name: Level 3 First Quarter - Compact Compilation, 7-Stage Test Suite & UI Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install NPM Dependencies
        run: npm ci || npm install

      - name: 🔍 TypeScript Type Check
        run: npm run build

      - name: 🧪 Execute Automated Real Flow & Contract Test Suites
        run: npm test

      - name: 🏗️ Build Vite Static Web UI (Production Dist)
        run: npm run build:ui
