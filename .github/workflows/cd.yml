name: Midnight DApp Continuous Deployment (CD) Pipeline

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  cd-build-and-deploy:
    name: Build & Deploy Production Web UI
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: ⚙️ Install Compact Compiler Toolchain
        run: |
          mkdir -p ~/.local/bin
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          curl -sSL https://raw.githubusercontent.com/midnight-ntwrk/compact/main/install.sh | bash || true

      - name: 📦 Install NPM Dependencies
        run: npm ci || npm install

      - name: 🔨 Compile Compact Smart Contract
        run: npm run compile

      - name: 🏗️ Build Production Dist Bundle
        run: npm run build:ui

      - name: 📦 Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-production
          path: dist/
          retention-days: 7

      - name: 🌐 Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
